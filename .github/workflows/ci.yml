name: CI

on:
  push:
    branches:
      - main
      - "mcp/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q main.py motor_local.py language_models.py version.py

      - name: Test
        run: python -m pytest

      - name: Dependency check
        run: python -m pip check
