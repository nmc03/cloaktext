name: Informe de error
description: Notifica un comportamiento incorrecto sin incluir datos sensibles.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        No adjuntes textos reales sensibles, claves de restauración, credenciales ni documentos privados.
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Instalación
      options:
        - Ejecutable Windows
        - Código fuente
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Describe el comportamiento observado usando datos ficticios.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Usa únicamente ejemplos inventados o anonimizados.
    validations:
      required: true
